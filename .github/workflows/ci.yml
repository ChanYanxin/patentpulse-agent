name: unit-and-eval
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m techintel.evaluation --save results/metrics.json
      - run: python -m techintel.patent_eval
      - run: python -m techintel.real_patent_eval --save results/real_patent_notes_metrics.json
